<script>
const KEY='smart-stock-v2';
const seed=()=>({seq:100,br:'ร้านหลัก',branches:['ร้านหลัก'],
 sups:[{id:1,name:'ซีพี',code:'CP',days:[],time:'12:00'},{id:2,name:'แม็คโคร',code:'MK',days:[],time:'12:00'}],
 products:[{id:1,br:'ร้านหลัก',sku:'FD-MK-001',cat:'นม/เครื่องดื่ม',name:'นมสดพาสเจอร์ไรส์ (เมจิ)',size:'2 ลิตร',sup:2,market:95,cost:95,qty:12,unit:'แกลลอน',min:5},
  {id:2,br:'ร้านหลัก',sku:'BE-CP-001',cat:'กาแฟ',name:'เมล็ดกาแฟอาราบิก้า (เนสกาแฟ)',size:'500g',sup:1,market:180,cost:175,qty:5,unit:'ถุง',min:5}],
 orders:[],moves:[],tx:[]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}

function poV(id){const o=S.orders.find(o=>o.id==id);if(!o)return;
 const L={ordered:'รอรับของ',received:'รับของแล้ว',cancelled:'ยกเลิกแล้ว'},rc=o.status=='received';
 dlg(`<h3>${poNo(o)} <span class="stp ${o.status=='ordered'?'w':o.status=='received'?'':'o'}">${L[o.status]}</span></h3><p class="sub">${esc(SP(o.sup)?.name||'-')} · สั่งเมื่อ ${fd(o.date)}${rc?' · รับเมื่อ '+fd(o.recv):''}${o.status=='cancelled'?' · ยกเลิกเมื่อ '+fd(o.cancelAt||o.date):''}</p>
 <div style="overflow-x:auto"><table style="min-width:480px"><tr><th>สินค้า</th><th>ยี่ห้อ</th><th>ขนาด</th><th class="n">จำนวนที่สั่ง</th>${rc?'<th class="n">ได้รับ</th><th class="n">ราคา/หน่วย</th><th class="n">รวม</th>':''}</tr>${o.items.map(i=>{const p=P(i.pid)||{};return `<tr><td>${esc(p.name||'(ลบแล้ว)')}</td><td>${esc(p.brand||'-')}</td><td>${esc(p.size||'-')}</td><td class="n">${i.qty} ${esc(p.unit||'')}</td>${rc?`<td class="n">${i.recv??i.qty}</td><td class="n">${m2(i.price??0)}</td><td class="n"><b>${m2((i.recv??i.qty)*(i.price??0))}</b></td>`:''}</tr>`}).join('')}</table></div>
 ${rc?`<p style="text-align:right;margin:10px 0 0"><b>รวมทั้งหมด ${m2(o.total||0)}</b></p>`:''}
 <div class="ac" style="flex-wrap:wrap"><button class="bo" data-act="close">ปิด</button><button class="bo" data-act="copy2" data-id="${o.id}">คัดลอกข้อความ</button>${o.status=='ordered'?`<button class="bo" style="color:var(--rd)" data-act="po-cancel" data-id="${o.id}">ยกเลิกใบสั่งซื้อ</button><button class="bt g sm" data-act="po-recv" data-id="${o.id}">ยืนยันรับของ</button>`:''}</div>`)}
function recvForm(id){
 const o=S.orders.find(o=>o.id==id);if(!o)return;
 const rows=o.items.map((i,n)=>{const p=P(i.pid);if(!p)return '';return `<tr data-i="${n}"><td>${esc(p.name)}</td><td>${esc(p.brand||'-')}</td><td>${esc(p.size||'-')}</td><td><input type="number" min="0" step="any" data-rp="${n}" value="${p.cost}" style="width:100px;text-align:right" aria-label="ราคาจริงต่อหน่วย ${esc(p.name)}"></td><td class="n">${i.qty} ${esc(p.unit)}</td><td><input type="number" min="0" step="any" data-rq="${n}" value="${i.qty}" style="width:90px;text-align:right" aria-label="จำนวนที่ได้รับ ${esc(p.name)}"></td><td class="n" id="rt${n}"></td></tr>`}).join('');
 dlg(`<h3>ยืนยันรับสินค้า ${poNo(o)}</h3><p class="sub">${esc(SP(o.sup)?.name||'-')} · แก้ราคาหรือจำนวนให้ตรงกับของที่ได้รับจริง ระบบจะบันทึกราคาล่าสุดเป็นราคาต้นทุนของสินค้า และเพิ่มสต๊อกตามจำนวนที่ได้รับ</p>
 <div style="overflow-x:auto"><table id="rv" style="min-width:640px"><tr><th>สินค้า</th><th>ยี่ห้อ</th><th>ขนาด</th><th>ราคา / หน่วย</th><th class="n">จำนวนที่สั่ง</th><th>จำนวนที่ได้รับ</th><th class="n">ราคารวม</th></tr>${rows}</table></div>
 <div class="row" style="margin:14px 0 0"><span class="sub">ราคารวม = ราคาจริง × จำนวนที่ได้รับ</span><b style="font-size:18px">รวมทั้งหมด <span id="rg"></span></b></div>
 <div class="ac"><button class="bo" data-act="close">ยกเลิก</button><button class="bt g sm" data-act="recv-ok" data-id="${o.id}">ยืนยันรับสินค้า</button></div>`);
 $('#dlg').style.width='min(940px,96vw)';recalc();
}
function recalc(){let g=0;document.querySelectorAll('#rv tr[data-i]').forEach(r=>{const pr=+r.querySelector('[data-rp]').value||0,q=+r.querySelector('[data-rq]').value||0;g+=pr*q;$('#rt'+r.dataset.i).innerHTML='<b>'+m2(pr*q)+'</b>'});$('#rg').textContent=m2(g)}
/* ---------- utils ---------- */
function dlg(h){const d=$('#dlg');d.style.width='';d.innerHTML=h;if(!d.open)d.showModal()}
function download(n,t,x){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}
function settings(){
 dlg(`<h3>ตั้งค่า</h3><div class="f"><div class="fw"><label class="l">เพิ่มสาขา / ร้าน</label><div style="display:flex;gap:6px"><input id="s_br" placeholder="ชื่อสาขา"><button class="bo" data-act="br-add">เพิ่ม</button></div></div>
 <div class="fw"><label class="l">เพิ่มซัพพลายเออร์</label><div style="display:flex;gap:6px"><input id="s_sn" placeholder="ชื่อ"><input id="s_sc" placeholder="รหัสย่อ" style="width:110px"><button class="bo" data-act="sup-add">เพิ่ม</button></div></div>
 <div class="fw" style="display:flex;gap:8px;flex-wrap:wrap"><button class="bo" data-act="export">ส่งออกข้อมูล (JSON)</button><button class="bo" data-act="csv">ส่งออกสินค้า (CSV)</button><button class="bo" data-act="import">นำเข้าข้อมูล</button><button class="bo" data-act="imp-csv">นำเข้า CSV</button><button class="bo" data-act="tpl">ไฟล์ตัวอย่าง CSV</button><button class="bo" data-act="hexp">ส่งออกประวัติ (CSV)</button><button class="bo" data-act="pin-set">เปลี่ยนรหัสแอดมิน</button><button class="bo" style="color:var(--rd)" data-act="reset">ล้างข้อมูลทั้งหมด</button></div></div>
 <div class="ac"><button class="bt sm" data-act="close">ปิด</button></div>`);
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;return render()}
 const a=t.dataset.act,id=+t.dataset.id,g=k=>$('#f_'+k).value.trim();
 switch(a){
 case'close':return $('#dlg').close();
 case'settings':return settings();
 case'fs':fs=t.dataset.id=='all'?'all':id;return render();
 case'adj':{const p=P(id),d=+t.dataset.d;if(d<0&&p.qty<=0)return toast('สินค้าหมดแล้ว');mv(p,d,d>0?'ปรับเพิ่ม +1':'ปรับลด -1');save();return render()}
 case'p-new':return pForm();
 case'p-edit':return pForm(P(id));
 case'p-del':if(confirm('ลบสินค้านี้?')&&pin('ลบสินค้า')){S.products=S.products.filter(p=>p.id!=id);save();render()}return;
 case'p-sup-add':{const name=prompt('ชื่อซัพพลายเออร์ใหม่');if(!name||!name.trim())return;const clean=name.trim();let sup=S.sups.find(x=>x.name.trim().toLowerCase()==clean.toLowerCase());if(!sup){const code=(prompt('รหัสย่อซัพพลายเออร์ (เว้นว่างได้)')||'').trim().toUpperCase();sup={id:uid(),name:clean,code,days:[],time:'12:00',lead:1};S.sups.push(sup);save()}const sel=$('#f_sup');if(sel){let opt=[...sel.options].find(o=>+o.value===sup.id);if(!opt){opt=document.createElement('option');opt.value=sup.id;opt.textContent=sup.name;sel.appendChild(opt)}sel.value=sup.id}return toast('เพิ่มและเลือกซัพพลายเออร์แล้ว')}
 case'p-save':{
  if(!g('name'))return toast('กรุณากรอกชื่อสินค้า');
  if(id&&!pin('แก้ไขสินค้า'))return;
  const d={sku:g('sku'),brand:g('brand'),cat:g('cat'),name:g('name'),size:g('size'),sup:+$('#f_sup').value,unit:g('unit')||'ชิ้น',market:+g('market')||0,cost:+g('cost')||0,min:+g('min')||0},qn=+g('qty')||0;
  if(S.products.some(x=>x.br==S.br&&x.id!=id&&x.name.trim().toLowerCase()==d.name.toLowerCase())&&!confirm('มีสินค้าชื่อนี้อยู่แล้ว ต้องการบันทึกซ้ำหรือไม่?'))return;
  if(id){const p=P(id);Object.assign(p,d);if(qn!=p.qty)mv(p,qn-p.qty,'แก้ไขยอดคงเหลือ','adj')}
  else{const p={id:uid(),br:S.br,qty:0,...d};S.products.push(p);if(qn>0)mv(p,qn,'ยอดยกมา','open')}
  save();$('#dlg').close();render();return toast('บันทึกแล้ว')}
 case'mode':mode=t.dataset.m;return render();
 case'review':return review();
 case'confirm':return confirmDoc();
 case'doc':return docV(t.dataset.no);
 case'doc-cancel':return cancelDoc(t.dataset.no);
 case'fst':fst=fst==t.dataset.s?'':t.dataset.s;return render();
 case'hr':{const r=t.dataset.r;H.from=H.to=r=='t'?today():r=='y'?yday():'';return render()}
 case'del-sel':{if(!SEL.size)return toast('ยังไม่ได้เลือกสินค้า');if(confirm('ลบสินค้าที่เลือก '+SEL.size+' รายการ?')&&pin('ลบสินค้าที่เลือก')){S.products=S.products.filter(p=>!SEL.has(p.id));SEL.clear();save();render();toast('ลบแล้ว')}return}
 case'hexp':return download('history.csv','text/csv;charset=utf-8',csvT([['เลขที่เอกสาร','วันที่','เวลา','สินค้า','หมวดหมู่','ประเภท','รับเข้า','เบิกออก','คงเหลือ','หมายเหตุ','ผู้บันทึก'],...histRows().map(m=>[m.no,m.date,new Date(m.t).toLocaleTimeString('th-TH'),m.name,m.cat,tyl(m),m.d>0?m.d:'',m.d<0?-m.d:'',m.after,m.note,m.by])]));
 case'imp-csv':return $('#csvf').click();
 case'tpl':return download('ตัวอย่างนำเข้าสินค้า.csv','text/csv;charset=utf-8',csvT([['ชื่อสินค้า','หมวดหมู่','หน่วยนับ','จำนวนขั้นต่ำ','ยอดยกมา','รหัส','ขนาด','ซัพพลายเออร์','ราคาแม็คโคร','ต้นทุนจริง'],['น้ำตาลทราย','เครื่องปรุง','ถุง',5,20,'SG-001','1 กก.','แม็คโคร',30,29]]));
 case'pin-set':{if(!pin('เปลี่ยนรหัสแอดมิน'))return;const n=prompt('รหัสใหม่ (อย่างน้อย 4 ตัว)');if(n&&n.length>=4){S.pin=n;save();toast('เปลี่ยนรหัสแล้ว')}return}
 case'po-new':case'po-new':return poForm();
 case'acc':CL[t.dataset.c]=CL[t.dataset.c]===false;return tbl();
 case'ox':OX[id]=!OX[id];return render();
 case'ov':ov=t.dataset.v;return render();
 case'po-sup':return poForm(id);
 case'po-low':{const f=B(S.products).find(low);return poForm(f?f.sup:0)}
 case'line':return addLine();
 case'rm':t.parentElement.remove();return;
 case'po-save':{
  const items=[...document.querySelectorAll('#lines .ln')].map(r=>({pid:+r.children[0].value,qty:+r.children[1].value})).filter(i=>i.qty>0);
  if(!items.length)return toast('เพิ่มรายการสินค้าอย่างน้อย 1 รายการ');
  const o={id:uid(),br:S.br,sup:+$('#po_sup').value,date:Date.now(),items,status:'ordered'};S.orders.push(o);pv=o.id;
  save();$('#dlg').close();tab='order';render();return toast('สร้างใบสั่งซื้อแล้ว')}
 case'po-view':return poV(id);
 case'copy2':{const o=S.orders.find(o=>o.id==id);navigator.clipboard?.writeText(poTxt(o)).then(()=>toast('คัดลอกแล้ว'),()=>toast('คัดลอกไม่ได้'));return}
 case'copy':{const o=S.orders.find(o=>o.id==pv);navigator.clipboard?.writeText($('.pv').textContent).then(()=>toast('คัดลอกแล้ว'),()=>toast('คัดลอกไม่ได้'));return}
 case'po-recv':return recvForm(id);
 case'recv-ok':{
  const o=S.orders.find(o=>o.id==id);let tot=0;
  const rs=[...document.querySelectorAll('#rv tr[data-i]')].map(r=>({i:o.items[+r.dataset.i],pr:+r.querySelector('[data-rp]').value,q:+r.querySelector('[data-rq]').value}));
  if(rs.some(x=>!(x.pr>=0)||!(x.q>=0)))return toast('ราคาและจำนวนต้องเป็นตัวเลขไม่ติดลบ');
  if(!rs.some(x=>x.q>0))return toast('ยังไม่ได้ระบุจำนวนที่ได้รับ');
  rs.forEach(({i,pr,q})=>{const p=P(i.pid);i.recv=q;i.price=pr;if(!p||!(q>0))return;p.cost=pr;mv(p,q,'รับของ '+poNo(o)+' @ '+m2(pr),'in',poNo(o));tot+=q*pr});
  o.status='received';o.recv=Date.now();o.total=tot;
  if(tot>0)S.tx.push({id:uid(),br:S.br,t:Date.now(),type:'out',amt:tot,cat:'ซื้อสินค้า',note:poNo(o)});
  save();$('#dlg').close();render();return toast('รับของเข้าสต๊อกแล้ว บันทึกราคาล่าสุดแล้ว')}
 case'po-cancel':{const o=S.orders.find(o=>o.id==id);if(o&&o.status=='ordered'&&confirm('ยกเลิกใบสั่งซื้อ '+poNo(o)+' ?')){o.status='cancelled';o.cancelAt=Date.now();if(pv==id)pv=null;save();if($('#dlg').open)$('#dlg').close();render();toast('ยกเลิกใบสั่งซื้อแล้ว')}return}
 case'sch':return schForm(SP(id));
 case'sch-save':{const s=SP(id);s.days=[...document.querySelectorAll('.dys input:checked')].map(x=>+x.value);s.time=$('#sc_t').value||'12:00';s.lead=+$('#sc_l').value||0;save();$('#dlg').close();render();return toast('บันทึกเวลาแล้ว')}
 case'tx-add':{const amt=+$('#t_amt').value;if(!(amt>0))return toast('กรุณากรอกจำนวนเงิน');
  S.tx.push({id:uid(),br:S.br,t:Date.now(),type:$('#t_ty').value,amt,cat:$('#t_cat').value.trim()||'อื่นๆ',note:$('#t_note').value.trim()});save();render();return toast('บันทึกแล้ว')}
 case'tx-del':S.tx=S.tx.filter(x=>x.id!=id);save();render();return;
 case'br-add':{const n=$('#s_br').value.trim();if(!n||S.branches.includes(n))return toast('ชื่อสาขาว่างหรือซ้ำ');S.branches.push(n);save();render();return toast('เพิ่มสาขาแล้ว')}
 case'sup-add':{const n=$('#s_sn').value.trim();if(!n)return toast('กรุณากรอกชื่อ');S.sups.push({id:uid(),name:n,code:$('#s_sc').value.trim().toUpperCase(),days:[],time:'12:00'});save();render();return toast('เพิ่มซัพพลายเออร์แล้ว')}
 case'export':return download('smart-stock-backup.json','application/json',JSON.stringify(S,null,1));
 case'csv':{const c=v=>`"${String(v??'').replace(/"/g,'""')}"`;return download('products.csv','text/csv;charset=utf-8','\ufeff'+['รหัส,ชื่อสินค้า,หมวดหมู่,ขนาด,ซัพพลายเออร์,ราคาแม็คโคร,ต้นทุนจริง,คงเหลือ,หน่วย,ขั้นต่ำ',...B(S.products).map(p=>[p.sku,p.name,p.cat,p.size,SP(p.sup)?.name,p.market,p.cost,p.qty,p.unit,p.min].map(c).join(','))].join('\n'))}
 case'import':return $('#file').click();
 case'reset':if(confirm('ล้างข้อมูลทั้งหมดและกลับเป็นข้อมูลตัวอย่าง?')&&pin('ล้างข้อมูล')){S=seed();save();$('#dlg').close();render()}return;
 }
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.rp!==undefined||t.dataset.rq!==undefined)return recalc();
 if(t.id=='q'){q=t.value;tbl()}
 else if(t.id=='mq'){mq=t.value;mtbl()}
 else if(t.dataset.d){D[mode][t.dataset.d]=t.value;const p=P(t.dataset.d),c=$('#af'+p.id);if(c)c.innerHTML=after(p,t.value);cnt()}
 else if(t.dataset.m)M[mode][t.dataset.m]=t.value;
 else if(t.dataset.h&&t.tagName=='INPUT'&&t.type=='text'){H.q=t.value;htbl()}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id=='ol'){onlyLow=t.checked;tbl()}
 else if(t.id=='fc'){fcat=t.value;tbl()}
 else if(t.id=='mc'){mcat=t.value;mtbl()}
 else if(t.id=='br'){S.br=t.value;save();SEL.clear();render()}
 else if(t.id=='po_sup')poForm(+t.value);
 else if(t.id=='sa'){SEL.clear();if(t.checked)B(S.products).forEach(p=>SEL.add(p.id));tbl()}
 else if(t.dataset.sel){t.checked?SEL.add(+t.dataset.sel):SEL.delete(+t.dataset.sel);selN()}
 else if(t.dataset.h){H[t.dataset.h]=t.value;htbl()}
});
$('#csvf').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{e.target.value='';importCSV(r.result)};r.readAsText(f)});
$('#file').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products)||!Array.isArray(d.sups))throw 0;if(!confirm('นำเข้าข้อมูลจะแทนที่ข้อมูลปัจจุบันทั้งหมด ต้องการดำเนินการต่อ?'))return;S=d;save();$('#dlg').close();render();toast('นำเข้าข้อมูลแล้ว')}catch(x){toast('ไฟล์ไม่ถูกต้อง ใช้ไฟล์ JSON ที่ส่งออกจากระบบนี้')}e.target.value=''};
 r.readAsText(f);
});
tick();render();
</script>
</body>
</html>
